services:
  exasol-engine:
    image: exasol/docker-db:latest
    container_name: exasol-personal-db
    restart: unless-stopped
    ports:
      - "8563:8563"
    environment:
      - EXA_MEM_SIZE=2GiB
    privileged: true
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/8563' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - scm-network

  cockpit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blast-radius-cockpit
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - EXASOL_DSN=exasol-engine:8563
      - EXASOL_USER=sys
      - EXASOL_PASSWORD=exasol
      - EXASOL_SCHEMA=CHAKAN_SCM
      - EXASOL_ENCRYPTION=True
      - EXASOL_VALIDATE_CERT=False
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
    depends_on:
      exasol-engine:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - scm-network

networks:
  scm-network:
    driver: bridge
