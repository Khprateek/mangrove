<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="markBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b172e" />
      <stop offset="60%" stop-color="#081225" />
      <stop offset="100%" stop-color="#040812" />
    </radialGradient>

    <linearGradient id="markLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84f244" />
      <stop offset="50%" stop-color="#5fc22d" />
      <stop offset="100%" stop-color="#3b8a16" />
    </linearGradient>

    <linearGradient id="markCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="markAlert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c" />
      <stop offset="100%" stop-color="#ff5370" />
    </linearGradient>

    <filter id="markGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="markCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box with Rounded Chamfer -->
  <rect x="12" y="12" width="488" height="488" rx="80" fill="url(#markBgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Background Radar Grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="150" fill="none" stroke-dasharray="6 6" />
    <line x1="256" y1="46" x2="256" y2="466" stroke-dasharray="6 6" />
    <line x1="46" y1="256" x2="466" y2="256" stroke-dasharray="6 6" />
    <line x1="108" y1="108" x2="404" y2="404" stroke-dasharray="4 6" opacity="0.5" />
    <line x1="108" y1="404" x2="404" y2="108" stroke-dasharray="4 6" opacity="0.5" />
  </g>

  <!-- Outer Blast Radius Shockwave (Ring 3: 48h Horizon) -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#334155" stroke-width="2.5" stroke-dasharray="10 16" opacity="0.6" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#markCyan)" stroke-width="4.5" stroke-dasharray="40 400" stroke-dashoffset="90" filter="url(#markCyanGlow)" />

  <!-- Middle Blast Radius Shockwave (Ring 2: 24h Horizon) -->
  <circle cx="256" cy="256" r="135" fill="none" stroke="#1e293b" stroke-width="3" />
  <circle cx="256" cy="256" r="135" fill="none" stroke="url(#markLime)" stroke-width="6" stroke-dasharray="90 180" stroke-dashoffset="45" filter="url(#markGlow)" />

  <!-- Inner Blast Radius Shockwave (Ring 1: 8h Starvation Horizon) -->
  <circle cx="256" cy="256" r="90" fill="none" stroke="url(#markAlert)" stroke-width="5" stroke-dasharray="45 90" stroke-dashoffset="15" opacity="0.9" />

  <!-- Outer Hexagonal Armor -->
  <polygon points="256,155 343,205 343,307 256,357 169,307 169,205" fill="#0b172a" stroke="#1e293b" stroke-width="3.5" />

  <!-- Inner Hexagonal Microchip Core -->
  <polygon points="256,175 325,215 325,297 256,337 187,297 187,215" fill="#081225" stroke="url(#markLime)" stroke-width="5.5" filter="url(#markGlow)" />

  <!-- Circuit Traces -->
  <line x1="256" y1="175" x2="256" y2="337" stroke="#5fc22d" stroke-width="3.5" opacity="0.85" />
  <line x1="187" y1="256" x2="325" y2="256" stroke="#00e5ff" stroke-width="3.5" opacity="0.85" />

  <!-- Central Starvation Nucleus -->
  <circle cx="256" cy="256" r="20" fill="url(#markLime)" filter="url(#markGlow)" />
  <circle cx="256" cy="256" r="8" fill="#ffffff" />

  <!-- Critical Shockwave Threat Orbiting Nodes -->
  <circle cx="350" cy="160" r="9" fill="#00e5ff" filter="url(#markCyanGlow)" />
  <circle cx="395" cy="330" r="8" fill="#5fc22d" filter="url(#markGlow)" />
  <circle cx="115" cy="345" r="9" fill="#ff5370" />
  <circle cx="160" cy="170" r="7" fill="#00e5ff" />
</svg>
