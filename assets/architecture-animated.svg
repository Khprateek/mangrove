<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e14" />
      <stop offset="50%" stop-color="#0a1219" />
      <stop offset="100%" stop-color="#060a0f" />
    </linearGradient>

    <!-- Exasol Green Gradients -->
    <linearGradient id="exasol-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fc22d" />
      <stop offset="100%" stop-color="#00d084" />
    </linearGradient>

    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5fc22d" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00d084" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101923" />
      <stop offset="100%" stop-color="#0d141d" />
    </linearGradient>

    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5fc22d" />
      <stop offset="100%" stop-color="#7bdcb5" />
    </linearGradient>

    <linearGradient id="bar-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f85149" />
      <stop offset="100%" stop-color="#ff7b72" />
    </linearGradient>

    <linearGradient id="bar-amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922" />
      <stop offset="100%" stop-color="#e3b341" />
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5fc22d" />
    </marker>
  </defs>

  <style>
    @keyframes flow {
      from { stroke-dashoffset: 24; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    @keyframes float-slow {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-4px) translateX(3px); }
    }
    @keyframes float-rev {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(4px) translateX(-3px); }
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .flow-line {
      stroke-dasharray: 5, 5;
      animation: flow 1s linear infinite;
    }
    .flow-line-rev {
      stroke-dasharray: 5, 5;
      animation: flow 1.2s linear infinite reverse;
    }
    .pulse-dot {
      transform-origin: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .pulse-dot-fast {
      transform-origin: center;
      animation: pulse 1.2s ease-in-out infinite;
    }
    .particle-1 { animation: float-slow 3s ease-in-out infinite; }
    .particle-2 { animation: float-rev 4s ease-in-out infinite; }
    .particle-3 { animation: float-slow 3.5s ease-in-out infinite 1s; }

    .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Deep Canvas -->
  <rect width="1120" height="360" rx="14" fill="url(#bg)" />

  <!-- Background Dots (Faint Grid) -->
  <g opacity="0.15">
    <circle cx="60" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="120" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="180" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="240" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="300" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="360" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="420" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="480" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="540" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="600" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="660" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="720" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="780" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="840" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="900" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="960" cy="40" r="1" fill="#7bdcb5" />
    <circle cx="1020" cy="40" r="1" fill="#7bdcb5" />
  </g>

  <!-- ========================================================================= -->
  <!-- TOP SECTION LABELS (COCOINDEX MONOSPACE STYLE) -->
  <!-- ========================================================================= -->
  <text x="70" y="38" fill="#5fc22d" class="font-mono" font-size="11" letter-spacing="2.5" font-weight="700">INBOUND · CHAOS</text>
  <text x="475" y="38" fill="#5fc22d" class="font-mono" font-size="11" letter-spacing="2.5" font-weight="700">IN-MEMORY · HARMONIZE</text>
  <text x="895" y="38" fill="#5fc22d" class="font-mono" font-size="11" letter-spacing="2.5" font-weight="700">PLANNER · TRIAGE</text>

  <!-- ========================================================================= -->
  <!-- STAGE 1: 4 STACKED INBOUND CARDS (LEFT) -->
  <!-- ========================================================================= -->
  <g transform="translate(68, 60)">
    <!-- Card 1: Inbound ASNs -->
    <g transform="translate(0, 0)">
      <rect width="270" height="52" rx="10" fill="url(#card-grad)" stroke="#223547" stroke-width="1.2" />
      <rect x="12" y="14" width="24" height="24" rx="6" fill="#172b3c" />
      <text x="17" y="30" fill="#79b8ff" class="font-mono" font-size="11">&lt;/&gt;</text>
      <text x="46" y="26" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">MSME Inbound ASNs</text>
      <text x="46" y="41" fill="#7d9dbf" class="font-mono" font-size="10">UOM drift · aliases · 498 rows</text>
      <!-- Pulsing Green Dot -->
      <circle cx="250" cy="26" r="4.5" fill="#5fc22d" class="pulse-dot" />
    </g>

    <!-- Card 2: ERP Schedules -->
    <g transform="translate(0, 62)">
      <rect width="270" height="52" rx="10" fill="url(#card-grad)" stroke="#223547" stroke-width="1.2" />
      <rect x="12" y="14" width="24" height="24" rx="6" fill="#1c233c" />
      <text x="19" y="30" fill="#a371f7" class="font-mono" font-size="12">#</text>
      <text x="46" y="26" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">ERP Production Runs</text>
      <text x="46" y="41" fill="#7d9dbf" class="font-mono" font-size="10">₹37.88 Cr output · 4 schedules</text>
      <!-- Pulsing Purple Dot -->
      <circle cx="250" cy="26" r="4.5" fill="#a371f7" class="pulse-dot" />
    </g>

    <!-- Card 3: Purchase Orders -->
    <g transform="translate(0, 124)">
      <rect width="270" height="52" rx="10" fill="url(#card-grad)" stroke="#223547" stroke-width="1.2" />
      <rect x="12" y="14" width="24" height="24" rx="6" fill="#2d1c24" />
      <text x="17" y="31" fill="#f85149" class="font-mono" font-size="12">PO</text>
      <text x="46" y="26" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">Purchase Order Ledger</text>
      <text x="46" y="41" fill="#7d9dbf" class="font-mono" font-size="10">open PO line validation</text>
      <!-- Pulsing Coral Dot -->
      <circle cx="250" cy="26" r="4.5" fill="#f85149" class="pulse-dot" />
    </g>

    <!-- Card 4: WMS Bin Inventory -->
    <g transform="translate(0, 186)">
      <rect width="270" height="52" rx="10" fill="url(#card-grad)" stroke="#223547" stroke-width="1.2" />
      <rect x="12" y="14" width="24" height="24" rx="6" fill="#2c2514" />
      <text x="18" y="31" fill="#d29922" class="font-mono" font-size="12">W</text>
      <text x="46" y="26" fill="#ffffff" class="font-sans" font-size="13" font-weight="700">WMS Physical Bins</text>
      <text x="46" y="41" fill="#7d9dbf" class="font-mono" font-size="10">16 bins · damaged / holds</text>
      <!-- Pulsing Amber Dot -->
      <circle cx="250" cy="26" r="4.5" fill="#d29922" class="pulse-dot" />
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ACTIVE FLOWING CONNECTING LINES (MSME FEEDS -> EXASOL CORE) -->
  <!-- ========================================================================= -->
  <path d="M 338 86 C 410 86, 450 150, 480 165" fill="none" stroke="#5fc22d" stroke-width="1.8" class="flow-line" opacity="0.85" />
  <path d="M 338 148 C 400 148, 440 165, 480 175" fill="none" stroke="#7bdcb5" stroke-width="1.8" class="flow-line" opacity="0.85" />
  <path d="M 338 210 C 400 210, 440 190, 480 185" fill="none" stroke="#5fc22d" stroke-width="1.8" class="flow-line" opacity="0.85" />
  <path d="M 338 272 C 410 272, 450 205, 480 195" fill="none" stroke="#7bdcb5" stroke-width="1.8" class="flow-line" opacity="0.85" />

  <!-- ========================================================================= -->
  <!-- STAGE 2: EXASOL PERSONAL ENGINE CORE (CENTER CIRCULAR ORB) -->
  <!-- ========================================================================= -->
  <g transform="translate(540, 180)">
    <!-- Ambient Green Glow Rings -->
    <circle cx="0" cy="0" r="76" fill="url(#core-glow)" />
    <circle cx="0" cy="0" r="64" fill="#071912" stroke="#1d482c" stroke-width="1" />
    <circle cx="0" cy="0" r="54" fill="#092419" stroke="#5fc22d" stroke-width="1.8" stroke-dasharray="4, 3" class="flow-line" />
    
    <!-- Central Monolith Core -->
    <circle cx="0" cy="0" r="42" fill="#0d3122" stroke="#5fc22d" stroke-width="2" />
    
    <!-- Stylized Exasol Logo / Diamond Icon -->
    <g transform="translate(-16, -16)">
      <polygon points="16,2 30,16 16,30 2,16" fill="url(#exasol-green-grad)" />
      <polygon points="16,8 24,16 16,24 8,16" fill="#061a11" />
      <circle cx="16" cy="16" r="3" fill="#5fc22d" />
    </g>

    <!-- Floating Data Packets / Green Particles -->
    <circle cx="-58" cy="-35" r="3" fill="#5fc22d" class="particle-1" opacity="0.9" />
    <circle cx="56" cy="-38" r="4" fill="#00d084" class="particle-2" opacity="0.8" />
    <circle cx="62" cy="30" r="3" fill="#7bdcb5" class="particle-3" opacity="0.9" />
    <circle cx="-50" cy="42" r="3.5" fill="#5fc22d" class="particle-2" opacity="0.85" />
    <circle cx="0" cy="-62" r="2.5" fill="#00d084" class="particle-1" opacity="0.75" />

    <!-- Core Title Below Orb -->
    <text x="0" y="86" fill="#ffffff" class="font-sans" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="-0.3">Exasol Personal</text>
    <text x="0" y="104" fill="#5fc22d" class="font-mono" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1.5">IN-DB PYTHON 3 UDFs · ONLY TRUE SHORTAGES</text>
  </g>

  <!-- ========================================================================= -->
  <!-- ACTIVE CONNECTOR (EXASOL -> PRODUCTION AGENT / COCKPIT) -->
  <!-- ========================================================================= -->
  <path d="M 605 180 L 685 180" fill="none" stroke="#5fc22d" stroke-width="2.5" marker-end="url(#arrow-green)" class="flow-line" />

  <!-- Robot / Agent Avatar in Center-Right -->
  <g transform="translate(710, 145)">
    <!-- Antenna -->
    <line x1="28" y1="0" x2="28" y2="8" stroke="#ff7b72" stroke-width="2" />
    <circle cx="28" cy="0" r="3" fill="#ff7b72" />
    <!-- Head -->
    <rect x="8" y="8" width="40" height="34" rx="8" fill="#ffd166" stroke="#c99f36" stroke-width="1.2" />
    <!-- Screen -->
    <rect x="13" y="13" width="30" height="24" rx="5" fill="#141a24" />
    <!-- Eyes -->
    <circle cx="21" cy="24" r="2.5" fill="#5fc22d" class="pulse-dot-fast" />
    <circle cx="35" cy="24" r="2.5" fill="#5fc22d" class="pulse-dot-fast" />
    <!-- Smile -->
    <path d="M 23 29 Q 28 33 33 29" fill="none" stroke="#5fc22d" stroke-width="1.4" stroke-linecap="round" />
    
    <!-- Agent Subtitle -->
    <text x="28" y="58" fill="#ffffff" class="font-sans" font-size="12" font-weight="700" text-anchor="middle">planner triage</text>
    <text x="28" y="71" fill="#7d9dbf" class="font-mono" font-size="9" text-anchor="middle" letter-spacing="1">DECISION ALIGNED</text>
  </g>

  <!-- ========================================================================= -->
  <!-- STAGE 3: DECISION COCKPIT CARD (RIGHT - MATCHING COCOINDEX STAT CARD) -->
  <!-- ========================================================================= -->
  <g transform="translate(800, 60)">
    <rect width="255" height="238" rx="12" fill="url(#card-grad)" stroke="#1d482c" stroke-width="1.4" />
    
    <!-- Header -->
    <text x="18" y="28" fill="#5fc22d" class="font-mono" font-size="11" font-weight="700" letter-spacing="2">BLAST-RADIUS · LIVE</text>

    <!-- Bar 1: Scheduled Output -->
    <g transform="translate(18, 48)">
      <circle cx="4" cy="5" r="4" fill="#79b8ff" />
      <rect x="18" y="0" width="168" height="10" rx="5" fill="#1b2a3a" />
      <rect x="18" y="0" width="168" height="10" rx="5" fill="#79b8ff" />
      <text x="195" y="9" fill="#e6edf3" class="font-mono" font-size="10">₹37.9 Cr</text>
      <text x="18" y="-4" fill="#7d9dbf" class="font-mono" font-size="9">Scheduled (48h)</text>
    </g>

    <!-- Bar 2: False Alarms Cleared -->
    <g transform="translate(18, 86)">
      <circle cx="4" cy="5" r="4" fill="#5fc22d" />
      <rect x="18" y="0" width="168" height="10" rx="5" fill="#1b2a3a" />
      <rect x="18" y="0" width="128" height="10" rx="5" fill="url(#bar-green)" />
      <text x="195" y="9" fill="#5fc22d" class="font-mono" font-size="10" font-weight="700">₹20.8 Cr</text>
      <text x="18" y="-4" fill="#7d9dbf" class="font-mono" font-size="9">Cleared by In-DB UDFs</text>
    </g>

    <!-- Bar 3: True Net Shortage -->
    <g transform="translate(18, 124)">
      <circle cx="4" cy="5" r="4" fill="#f85149" />
      <rect x="18" y="0" width="168" height="10" rx="5" fill="#1b2a3a" />
      <rect x="18" y="0" width="38" height="10" rx="5" fill="url(#bar-red)" />
      <text x="195" y="9" fill="#ff7b72" class="font-mono" font-size="10" font-weight="700">₹5.29 Cr</text>
      <text x="18" y="-4" fill="#7d9dbf" class="font-mono" font-size="9">Real Line Deficit (Hub)</text>
    </g>

    <!-- Bar 4: Phantom Warehouse Stock -->
    <g transform="translate(18, 162)">
      <circle cx="4" cy="5" r="4" fill="#d29922" />
      <rect x="18" y="0" width="168" height="10" rx="5" fill="#1b2a3a" />
      <rect x="18" y="0" width="22" height="10" rx="5" fill="url(#bar-amber)" />
      <text x="195" y="9" fill="#e3b341" class="font-mono" font-size="10">₹1.18 Cr</text>
      <text x="18" y="-4" fill="#7d9dbf" class="font-mono" font-size="9">Phantom Stock (16 Bins)</text>
    </g>

    <!-- Divider -->
    <line x1="18" y1="188" x2="237" y2="188" stroke="#1d482c" stroke-width="1" />

    <!-- Bottom Status Metrics -->
    <g transform="translate(18, 204)">
      <circle cx="5" cy="4" r="4" fill="#5fc22d" class="pulse-dot" />
      <text x="15" y="8" fill="#5fc22d" class="font-mono" font-size="10" font-weight="700">0 assembly line halts</text>
    </g>

    <g transform="translate(18, 224)">
      <text x="0" y="0" fill="#7d9dbf" class="font-mono" font-size="10">182K rows/s</text>
      <text x="145" y="0" fill="#5fc22d" class="font-mono" font-size="10" font-weight="700">54.4x speedup</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- 1-CLICK WRITEBACK REVERSE FEEDBACK LOOP ARROW -->
  <!-- ========================================================================= -->
  <path d="M 800 285 C 720 315, 630 310, 580 265" fill="none" stroke="#5fc22d" stroke-width="1.8" class="flow-line-rev" marker-end="url(#arrow-green)" opacity="0.9" />

  <g transform="translate(630, 318)">
    <rect width="160" height="22" rx="11" fill="#082315" stroke="#5fc22d" stroke-width="1.2" />
    <circle cx="12" cy="11" r="3.5" fill="#5fc22d" class="pulse-dot" />
    <text x="22" y="15" fill="#5fc22d" class="font-mono" font-size="9" font-weight="700">1-CLICK FIX (&lt;15ms IN-RAM)</text>
  </g>
</svg>
